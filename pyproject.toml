[project]
name = "finargy"
version = "0.0.1"
description = "Financial data analysis and API integration"
readme = "README.md"
authors = [
    { name = "Santiago Elewaut", email = "santielewaut@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[project.urls]
Homepage = "https://github.com/selewaut/finargy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finargy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
